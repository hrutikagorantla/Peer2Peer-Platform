<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tuit — My Sessions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrap">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div id="loader" class="loader"><div class="loader-ring"></div></div>

    <div id="content" style="display:none;">
      <div class="page-head">
        <div>
          <div class="page-eyebrow">Sessions</div>
          <h1 class="page-title" id="pageTitle">My sessions</h1>
          <div class="page-sub" id="pageSub">Your scheduled and past sessions.</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="actionBtn">+ Add session</button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filters">
        <div class="filter-row">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="search-input" id="ss" placeholder="Search sessions…" oninput="renderFiltered()">
          </div>
          <select class="filter-select" id="sf" onchange="renderFiltered()">
            <option value="">All status</option>
            <option value="available">Available</option>
            <option value="full">Full</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <div id="sessionList"></div>
    </div>
  </main>
</div>

<!-- add-session modal (mentor view only) -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <div class="modal-title">Add a session</div>
    <div class="modal-sub">Open a slot for students to book.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group" style="grid-column:1/-1;">
        <label class="form-label">Title</label>
        <input class="form-input" id="aTitle" placeholder="e.g. DSA fundamentals — recursion">
      </div>
      <div class="form-group">
        <label class="form-label">Subject</label>
        <select class="form-select" id="aSubj">
          <option value="">General</option>
          <option>DSA</option>
          <option>Algorithms</option>
          <option>OOP</option>
          <option>DBMS</option>
          <option>SQL</option>
          <option>Operating Systems</option>
          <option>Computer Networks</option>
          <option>Web Dev</option>
          <option>ML</option>
          <option>System Design</option>
          <option>Math</option>
          <option>Linear Algebra</option>
          <option>Calculus</option>
          <option>Discrete Math</option>
          <option>Physics</option>
          <option>Chemistry</option>
          <option>Biology</option>
          <option>English</option>
          <option>Aptitude</option>
          <option>Theory of Computation</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-select" id="aType">
          <option value="one_on_one">1-on-1</option>
          <option value="group">Group</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Start time</label>
        <input class="form-input" type="datetime-local" id="aStart">
      </div>
      <div class="form-group">
        <label class="form-label">End time</label>
        <input class="form-input" type="datetime-local" id="aEnd">
      </div>
      <div class="form-group">
        <label class="form-label">Price (₹)</label>
        <input class="form-input" type="number" id="aPrice" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Max students</label>
        <input class="form-input" type="number" id="aMax" placeholder="1" min="1" max="20">
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('addModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" id="aSave" onclick="saveSession()">Create session</button>
    </div>
  </div>
</div>

<!-- booking-confirm modal (student view) -->
<div class="modal-overlay" id="bookModal">
  <div class="modal-box">
    <div class="modal-title">Confirm booking</div>
    <div class="modal-sub" id="bookModalSub">—</div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('bookModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" id="bSave" onclick="confirmBook()">Confirm</button>
    </div>
  </div>
</div>

<div id="gt" class="g-toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
let U = null;
let allSessions = [];
let myBookings  = []; // for students: which sessions they've booked
let selSess = null;

async function init() {
  initDark();
  if (!await requireAuth()) return;
  U = await getCurrentUser();
  if (!U) { signOut(); return; }
  if (await ensureOnboarded(U)) return;
  document.getElementById('sidebar').innerHTML = buildSidebar(U, 'sessions');
  initSidebarUser(U);

  if (U.role === 'mentor') {
    document.getElementById('pageTitle').textContent = 'My sessions';
    document.getElementById('pageSub').textContent   = 'Manage your teaching slots.';
    document.getElementById('actionBtn').textContent = '+ Add session';
    document.getElementById('actionBtn').onclick = () => document.getElementById('addModal').classList.add('open');
  } else {
    document.getElementById('pageTitle').textContent = 'My sessions';
    document.getElementById('pageSub').textContent   = 'Your booked and upcoming sessions.';
    document.getElementById('actionBtn').textContent = '+ Book new';
    document.getElementById('actionBtn').onclick = () => window.location.href = 'booksession.html';
  }

  document.getElementById('loader').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  // Open Add modal if hash says so (linked from dash)
  if (window.location.hash === '#add' && U.role === 'mentor') {
    document.getElementById('addModal').classList.add('open');
  }

  await loadSessions();
}

async function loadSessions() {
  if (U.role === 'mentor') {
    const { data, error } = await db.from('sessions')
      .select('*')
      .eq('mentor_id', U.id)
      .order('start_time');
    if (error) { showToast('Failed to load', error.message, 'error'); return; }
    allSessions = data || [];
  } else {
    // Student view: show their booked sessions + currently available ones
    const { data: bookings } = await db.from('bookings')
      .select('id, status, session_id, sessions(*, users:mentor_id(full_name, rating))')
      .eq('student_id', U.id);

    myBookings = bookings || [];

    // Available sessions (not booked by user)
    const bookedIds = new Set(myBookings.map(b => b.session_id));
    const { data: avail } = await db.from('sessions')
      .select('*, users:mentor_id(full_name, rating)')
      .in('status', ['available', 'full'])
      .gte('start_time', new Date().toISOString())
      .order('start_time');

    // Combine: booked first (with booking metadata), then available not yet booked
    const bookedView = myBookings
      .filter(b => b.sessions)
      .map(b => ({ ...b.sessions, _booked: true, _bookingStatus: b.status }));

    const otherView = (avail || [])
      .filter(s => !bookedIds.has(s.id))
      .map(s => ({ ...s, _booked: false }));

    allSessions = [...bookedView, ...otherView];
  }

  renderFiltered();
}

function renderFiltered() {
  const q = document.getElementById('ss').value.toLowerCase();
  const f = document.getElementById('sf').value;

  let list = [...allSessions];
  if (q) {
    list = list.filter(s =>
      s.title?.toLowerCase().includes(q) ||
      s.subject?.toLowerCase().includes(q) ||
      s.users?.full_name?.toLowerCase().includes(q)
    );
  }
  if (f) list = list.filter(s => s.status === f);

  renderSessions(list);
}

function renderSessions(list) {
  const el = document.getElementById('sessionList');
  if (!list.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div class="empty-title">No sessions found</div>
      <div class="empty-sub">${U.role === 'mentor' ? 'Add a session to get started.' : 'Try adjusting filters or book a new session.'}</div>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="sessions-list">${list.map(s => {
    const d = new Date(s.start_time);
    const end = new Date(s.end_time);
    const isFull = (s.current_bookings || 0) >= (s.max_students || 1);
    const isLive = new Date() >= d && new Date() <= end;
    const mentor = s.users;
    const mins = Math.round((end - d) / 60000);

    let badge = '';
    if (isLive) badge = '<span class="badge badge-green"><span class="live-dot"></span>Live now</span>';
    else if (s.status === 'completed') badge = '<span class="badge badge-blue">Completed</span>';
    else if (s.status === 'cancelled') badge = '<span class="badge badge-red">Cancelled</span>';
    else if (isFull) badge = '<span class="badge badge-amber">Full</span>';
    else badge = '<span class="badge badge-green">Available</span>';

    let actionBtn = '';
    if (U.role === 'mentor') {
      actionBtn = `<button class="btn btn-secondary btn-sm" onclick="cancelSession('${s.id}')">Cancel</button>`;
    } else if (s._booked) {
      actionBtn = `<button class="btn btn-secondary btn-sm" disabled>Booked</button>`;
    } else if (!isFull && s.status === 'available') {
      actionBtn = `<button class="btn btn-primary btn-sm" onclick="openBook('${s.id}')">Book</button>`;
    } else {
      actionBtn = `<button class="btn btn-secondary btn-sm" disabled>${isFull ? 'Full' : s.status}</button>`;
    }

    return `<div class="scard ${isLive ? 'live-card' : ''}">
      <div class="session-datebox">
        <div class="sd">${d.toLocaleDateString('en', { weekday: 'short' })}</div>
        <div class="dn">${d.getDate()}</div>
      </div>
      <div class="session-info">
        <div class="session-title">${s.title}</div>
        <div class="session-meta">
          <span>${fmtTime(s.start_time)} · ${mins} min</span>·
          <span>${s.session_type === 'group' ? 'Group' : '1-on-1'}</span>
          ${mentor?.full_name ? `· <span>${mentor.full_name}</span>` : ''}
          ${s.subject && s.subject !== 'General' ? `· <span class="badge badge-blue">${s.subject}</span>` : ''}
          ${badge}
        </div>
      </div>
      <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
        <div class="serif" style="font-size:18px;font-weight:600;color:var(--accent);">${s.price ? `₹${s.price}` : 'Free'}</div>
        <div style="font-size:11.5px;color:var(--ink-3);">${s.current_bookings || 0}/${s.max_students || 1} booked</div>
        ${actionBtn}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// mentor: create a new session slot
async function saveSession() {
  const title = document.getElementById('aTitle').value.trim();
  const subj  = document.getElementById('aSubj').value;
  const type  = document.getElementById('aType').value;
  const start = document.getElementById('aStart').value;
  const end   = document.getElementById('aEnd').value;
  const price = parseFloat(document.getElementById('aPrice').value) || 0;
  const max   = parseInt(document.getElementById('aMax').value) || 1;

  if (!title || !start || !end) { showToast('Fill in all required fields', '', 'error'); return; }
  if (new Date(end) <= new Date(start)) { showToast('End time must be after start time', '', 'error'); return; }

  const btn = document.getElementById('aSave');
  setLoading(btn, true, 'Saving…');

  const { error } = await db.from('sessions').insert({
    mentor_id: U.id,
    title,
    subject: subj || 'General',
    session_type: type,
    start_time: start,
    end_time: end,
    price,
    max_students: max,
    current_bookings: 0,
    status: 'available'
  });

  if (error) {
    setLoading(btn, false);
    showToast('Failed to create session', error.message, 'error');
    return;
  }

  setLoading(btn, false);
  document.getElementById('addModal').classList.remove('open');

  // Reset form
  ['aTitle', 'aStart', 'aEnd', 'aPrice', 'aMax'].forEach(id => document.getElementById(id).value = '');

  showToast('Session created!', 'Students can now book this slot.', 'success');
  await loadSessions();
}

async function cancelSession(id) {
  if (!confirm('Cancel this session? Students who booked will be notified.')) return;
  const { error } = await db.from('sessions').update({ status: 'cancelled' }).eq('id', id);
  if (error) { showToast('Failed', error.message, 'error'); return; }
  showToast('Session cancelled', '', 'success');
  await loadSessions();
}

// student: open the booking modal for one row in the list
function openBook(id) {
  selSess = allSessions.find(s => s.id === id);
  if (!selSess) return;
  const d = new Date(selSess.start_time);
  const dayLabel = d.toLocaleDateString('en', { weekday: 'short', month: 'short', day: 'numeric' });
  document.getElementById('bookModalSub').innerHTML =
    `<b>${selSess.title}</b><br>${dayLabel} at ${fmtTime(selSess.start_time)}` +
    `${selSess.users?.full_name ? ` · with ${selSess.users.full_name}` : ''}` +
    `${selSess.price ? ` · ₹${selSess.price}` : ' · Free'}`;
  document.getElementById('bookModal').classList.add('open');
}

async function confirmBook() {
  if (!selSess) return;
  const btn = document.getElementById('bSave');
  setLoading(btn, true, 'Booking…');

  // Duplicate check
  const { data: ex } = await db.from('bookings').select('id')
    .eq('session_id', selSess.id).eq('student_id', U.id).maybeSingle();
  if (ex) {
    setLoading(btn, false);
    showToast('Already booked!', '', 'error');
    document.getElementById('bookModal').classList.remove('open');
    return;
  }

  // Freshness
  const { data: fresh } = await db.from('sessions')
    .select('current_bookings, max_students, status')
    .eq('id', selSess.id).single();
  if (!fresh || fresh.status !== 'available' || (fresh.current_bookings || 0) >= (fresh.max_students || 1)) {
    setLoading(btn, false);
    showToast('No longer available', '', 'error');
    document.getElementById('bookModal').classList.remove('open');
    loadSessions();
    return;
  }

  const { error } = await db.from('bookings').insert({
    session_id: selSess.id,
    student_id: U.id,
    status: 'confirmed',
    payment_status: 'unpaid',
    payment_amount: selSess.price
  });
  if (error) {
    setLoading(btn, false);
    showToast('Booking failed', error.message, 'error');
    return;
  }

  const nc = (fresh.current_bookings || 0) + 1;
  await db.from('sessions').update({
    current_bookings: nc,
    status: nc >= (fresh.max_students || 1) ? 'full' : 'available'
  }).eq('id', selSess.id);

  setLoading(btn, false);
  document.getElementById('bookModal').classList.remove('open');
  showToast('Booked!', 'Session confirmed. Check your dashboard.', 'success');
  await loadSessions();
}

init();
</script>
</body>
</html>
